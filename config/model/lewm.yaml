_target_: lewm.lewm.LeWM

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny                                                        # Decides output dimension (== embed_dim)
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: lewm.modules.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: lewm.modules.Embedder
  num_actions: ???
  emb_dim: ${embed_dim}

reward_head:
  _target_: lewm.modules.TransitionHead
  input_dim: ${eval:${embed_dim} * 2}
  output_dim: 1
  hidden_dim: 512

done_head:
  _target_: lewm.modules.TransitionHead
  input_dim: ${eval:${embed_dim} * 2}
  output_dim: 1
  hidden_dim: 512

projector:
  _target_: lewm.modules.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: lewm.modules.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true