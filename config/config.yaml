defaults:
  - _self_
  - local: log
  - env: atari
  - model: lewm
  - agent: ppo

seed: 0
game: pong
device: cuda

# -----------------------------------------------------------------------------
# Shared model/data dimensions
# -----------------------------------------------------------------------------

img_size: 128
embed_dim: 192
history_size: 3

# -----------------------------------------------------------------------------
# Loss weighting
# -----------------------------------------------------------------------------
loss_weights:
  pred_loss: 1
  sigreg_loss: 0.3
  rew_loss: 0.01
  don_loss: 0.01

# -----------------------------------------------------------------------------
# Imagination
# -----------------------------------------------------------------------------
imagination:
  max_horizon: 70
  history_size: ${history_size}
  done_threshold: 0.5

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
trainer:
  total_epochs: 500
  
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

  optimizer:
    type: AdamW
    lr: 5e-4
    weight_decay: 0.0

sanity_eval:
  every_x_epoch: 25
  episodes: 5
  per_episode_limit: 25000

collection_trainer:
  collection_limit: 110_000                             # Completion = 440
  collection_per_epoch: 250

wm_schedule:
  regular_start_epoch: 10
  regular_epochs: 10
  periodic_start_epoch: 20
  period: 5
  periodic_epochs: 30
  stop_epoch: 470

agent_trainer:
  agent_start_epoch: 20
  update_epochs: 4
  total_steps: 500_000

  gamma: 0.997
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

  optimizer:
    type: AdamW
    lr: 3e-4
    weight_decay: 0.0

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval:
  episodes: 25
  deterministic: true                                     # Not implemented
  per_episode_limit: 25000
  output_path: ./eval/${game}.json

# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
checkpointing:
  wm_per_epoch: 50
  agent_per_epoch: 50
  wm_path: ./checkpoints/${game}/world_model
  agent_path: ./checkpoints/${game}/agent

# -----------------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------------
loader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 3

# -----------------------------------------------------------------------------
# Replay storage
# -----------------------------------------------------------------------------
replay:
  _target_: replay.replay.Replay 
  path: ./data/${game}.h5
  obs_shape: [3, "${img_size}", "${img_size}"]

# -----------------------------------------------------------------------------
# Sequence dataset
# -----------------------------------------------------------------------------
dataset:
  _target_: replay.replay.ReplaySequenceDataset
  path: ${replay.path}
  seq_len: 32
  allow_cross_episode: false