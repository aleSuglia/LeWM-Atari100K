defaults:
  - _self_
  - local: log
  - env: atari
  - model: lewm
  - agent: agent

seed: 0
game: pong
device: cuda

# -----------------------------------------------------------------------------
# Shared model/data dimensions
# -----------------------------------------------------------------------------

img_size: 128
embed_dim: 512
history_size: 6

# -----------------------------------------------------------------------------
# Loss weighting
# -----------------------------------------------------------------------------
loss_weights:
  pred_loss: 1
  sigreg_loss: 0.25
  rew_loss: 0.05
  don_loss: 0.01

# -----------------------------------------------------------------------------
# Imagination
# -----------------------------------------------------------------------------
imagination:
  max_horizon: 50
  history_size: ${history_size}
  done_threshold: 0.5

# -----------------------------------------------------------------------------
# Training schedule
# -----------------------------------------------------------------------------
trainer:
  total_epochs: 600
  
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

  optimizer:
    type: AdamW
    lr: 1e-4
    weight_decay: 0.0

sanity_eval:
  every_x_epoch: 25
  episodes: 5
  per_episode_limit: 5000

collection_schedule:
  collection_limit: 100_200
  collection_per_epoch: 200
  random_collection_epochs: 10

wm_schedule:
  steps_per_epoch: 256
  start_epoch: 15
  regular_epochs: 2
  periodic_start_epoch: 50
  period: 5
  periodic_epochs: 8
  stop_epoch: 550

agent_trainer:
  agent_start_epoch: 50
  total_steps: 256_000

  gamma: 0.995
  lambda_: 0.95
  entropy_weight: 0.002
  max_grad_norm: 10.0

  optimizer:
    type: AdamW
    lr: 1e-4
    weight_decay: 0.0

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval:
  episodes: 100
  deterministic: true
  per_episode_limit: 108_000
  output_path: ./eval/${game}.json

# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
checkpointing:
  wm_per_epoch: 50
  agent_per_epoch: 50
  wm_path: ./checkpoints/${game}/world_model
  agent_path: ./checkpoints/${game}/agent

# -----------------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------------
loader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

# -----------------------------------------------------------------------------
# Replay storage
# -----------------------------------------------------------------------------
replay:
  _target_: replay.replay.Replay 
  path: ./data/${game}.h5
  obs_shape: [3, "${img_size}", "${img_size}"]

# -----------------------------------------------------------------------------
# Sequence dataset
# -----------------------------------------------------------------------------
dataset:
  _target_: replay.replay.ReplaySequenceDataset
  path: ${replay.path}
  batch_size: ${loader.batch_size}
  num_batches: ${wm_schedule.steps_per_epoch}
  seq_len: 16
  allow_cross_episode: false